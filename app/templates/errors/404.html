{% extends "base.html" %}

{% block title %}404 Not Found — Movie Magic{% endblock %}

{% block content %}
<div class="container text-center py-5 my-5">
  <div class="card-cinematic p-5 mx-auto" style="max-width: 520px;">
    <div class="mb-3 text-info">
      <i class="bi bi-film" style="font-size: 4rem;"></i>
    </div>
    <h2 class="fw-bold text-white mb-2">404 — Scene Not Found</h2>
    <p class="text-muted mb-4">
      The movie, showtime, or page you are looking for does not exist in our theater schedule.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-cinematic">
      <i class="bi bi-arrow-left me-1"></i> Back to Now Showing
    </a>
  </div>
</div>
{% endblock %}
